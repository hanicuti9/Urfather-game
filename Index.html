<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YOUR FATHER | @urfather.exe</title>
<style>
:root{--bg:#fff;--ink:#111;--mute:#8a8a8f;--btn2:#efeff1;--pink:#fe2c55;--line:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#f3f3f3;--mute:#9a9aa0;--btn2:#2a2a2d;--line:#121212}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Proxima Nova","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.page{max-width:480px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 10px}
.top svg{width:30px;height:30px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top .r{display:flex;gap:26px}
.head{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 20px 0}
h1{font-family:"Arial Black",Impact,sans-serif;font-style:italic;font-weight:900;font-size:2.15rem;line-height:1.1;margin:0;letter-spacing:-1px}
h1 .em{font-style:normal;font-size:1.6rem;margin-left:6px}
.handle{color:var(--mute);font-weight:700;font-size:1.15rem;margin:6px 0 10px}
.stats{display:flex;gap:34px}
.stats b{display:block;font-size:1.8rem;font-weight:800;line-height:1.1}
.stats span{color:var(--mute);font-size:1.05rem}
.logo{flex:none;width:34vw;max-width:150px;aspect-ratio:1;border-radius:50%;border:3px solid #4cc4c9;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin-top:6px}
.logo .a{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(1.1rem,6vw,1.7rem);line-height:1}
.logo .b{font-family:"Arial Black",Impact,sans-serif;font-size:clamp(1.6rem,8.5vw,2.4rem);line-height:1;color:#12b5c4}
.logo .c{font-size:.55rem;font-weight:700;margin-top:4px}
.actions{display:flex;gap:12px;padding:16px 20px 0}
.actions button{border:0;border-radius:6px;font:inherit;font-weight:800;font-size:1.25rem;padding:15px 0;cursor:pointer}
.follow{flex:1.1;background:var(--pink);color:#fff}
.follow.on{background:var(--btn2);color:var(--ink)}
.msg{flex:1.6;background:var(--btn2);color:var(--ink)}
.add{flex:none;width:58px;background:var(--btn2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.add svg{width:28px;height:28px}
.bio{padding:18px 20px 0;font-size:1.12rem;font-weight:500;line-height:1.45}
.bio div{margin:2px 0}
.fb{display:flex;align-items:center;gap:12px;padding:16px 20px 0;font-weight:800;font-size:1.1rem;line-height:1.3}
.av{display:flex}
.av i{width:48px;height:48px;border-radius:50%;border:2px solid var(--bg);margin-right:-14px}
.av i:nth-child(1){background:linear-gradient(135deg,#6fb98f,#d9c27a)}
.av i:nth-child(2){background:radial-gradient(#7a1b1b,#1c0707)}
.av i:nth-child(3){background:linear-gradient(135deg,#8a6a3d,#3b6e3b)}
.tab{display:flex;justify-content:center;padding:26px 0 8px;position:relative}
